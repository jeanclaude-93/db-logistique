<style>
:root{--bg:#f4f6f9;--sf:#fff;--tx:#1b2430;--mu:#657085;--bd:#dde2ea;--ac:#0b5cab;--ok:#17703d;--wa:#8a5200;--er:#a31d24;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161c;--sf:#1a2029;--tx:#e6eaf0;--mu:#97a1b3;--bd:#2c3542;--ac:#5aa6ee;--ok:#4cc27f;--wa:#e0a040;--er:#f0777c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12161c;--sf:#1a2029;--tx:#e6eaf0;--mu:#97a1b3;--bd:#2c3542;--ac:#5aa6ee;--ok:#4cc27f;--wa:#e0a040;--er:#f0777c;color-scheme:dark}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--tx);font:14px/1.4 Arial,Helvetica,sans-serif}
.app{display:flex;height:100%}
nav{width:236px;flex:none;overflow:auto;background:var(--sf);border-right:1px solid var(--bd);padding:10px 8px}
nav h1{font-size:15px;margin:4px 6px 8px}
nav h4{margin:12px 6px 4px;font-size:11px;text-transform:uppercase;color:var(--mu);letter-spacing:.04em}
nav button{display:block;width:100%;text-align:left;border:0;background:none;color:var(--tx);padding:6px 8px;border-radius:6px;cursor:pointer;font:inherit}
nav button:hover{background:var(--bg)}nav button.on{background:var(--ac);color:#fff}
main{flex:1;min-width:0;overflow:auto;padding:16px}
@media(max-width:760px){.app{flex-direction:column}nav{width:auto;max-height:34%;border-right:0;border-bottom:1px solid var(--bd)}}
h2{margin:0 0 2px;font-size:20px}.src{color:var(--mu);font-size:12px;margin-bottom:10px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0}
.bar input[type=search]{flex:1;min-width:140px}
input,select,textarea{font:inherit;color:var(--tx);background:var(--sf);border:1px solid var(--bd);border-radius:6px;padding:6px 8px;box-sizing:border-box}
.btn{border:1px solid var(--bd);background:var(--sf);color:var(--tx);border-radius:6px;padding:6px 12px;cursor:pointer;font:inherit}
.btn.p{background:var(--ac);border-color:var(--ac);color:#fff}.btn.d{color:var(--er)}
.tw{overflow-x:auto;background:var(--sf);border:1px solid var(--bd);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;white-space:nowrap;padding:7px 9px;border-bottom:2px solid var(--bd);background:var(--sf);color:var(--mu)}
td{padding:6px 9px;border-bottom:1px solid var(--bd);vertical-align:top}
tr.t td{font-weight:bold;background:var(--bg)}.r{text-align:right;white-space:nowrap}
.act{white-space:nowrap}.act button{border:0;background:none;cursor:pointer;color:var(--ac);font-size:15px}
.b{padding:1px 8px;border-radius:10px;font-size:12px;white-space:nowrap;display:inline-block}
.e{background:rgba(192,38,45,.15);color:var(--er)}.w{background:rgba(224,160,64,.2);color:var(--wa)}.o{background:rgba(40,160,100,.16);color:var(--ok)}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:10px 0 16px}
.k{background:var(--sf);border:1px solid var(--bd);border-radius:8px;padding:10px 12px}
.k span{color:var(--mu);font-size:12px}.k b{display:block;font-size:20px;margin-top:2px}.k small{color:var(--mu)}
h3{margin:18px 0 8px;font-size:15px}.al{background:var(--sf);border:1px solid var(--bd);border-radius:8px;padding:4px 12px}
.al div{padding:6px 0;border-bottom:1px solid var(--bd)}.al div:last-child{border:0}
.note{color:var(--mu);font-size:12px;margin-top:14px}
dialog{background:var(--sf);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:16px;width:min(560px,92vw)}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog label{display:block;font-size:12px;color:var(--mu);margin-bottom:8px}dialog label input,dialog label select{display:block;width:100%;margin-top:3px;color:var(--tx)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px;max-height:60vh;overflow:auto}
dialog textarea{width:100%;height:240px;font:12px monospace}

(()=>{
const NOW=new Date(),YR=NOW.getFullYear(),KEY='logdb-v1';
const num=v=>(v===''||v==null||isNaN(+v))?0:+v;

const stk=(r,D)=>mv(D,r.ref,'Entrée')-mv(D,r.ref,'Sortie');
const mini=r=>num(r.cjm)*num(r.dl)+num(r.ss);

const fin3=(r,D)=>num(r.ini)+m3(D,r.code,'Entrée')-m3(D,r.code,'Sortie');
const pid=(n,D)=>{const w=String(n||'').split(' ');return D.pers.find(x=>x.role==='Chauffeur'&&x.nom.startsWith(w[0])&&(!w[1]||x.nom.split(' ').pop().startsWith(w[1][0])))};

const norme=z=>/asphalte/i.test(z)?12:/masisi/i.test(z)?22:/rutshuru/i.test(z)?16:15;
const cons=r=>num(r.kmd)?num(r.lit)/num(r.kmd)*100:NaN;
const eca=r=>(cons(r)-norme(r.zone))/norme(r.zone);
const calert=r=>{const e=eca(r);return !isFinite(e)?'':e>.15?'Surconsommation':e<-.15?'Sous-consommation':'Normal'};

const aam=r=>Math.min(avb(r),avb(r)*num(r.taux)/100*ans(r));

const ech=r=>{if(!r.next)return'';const d=Math.round((new Date(r.next)-NOW)/864e5);return d<0?'Échu ('+(-d)+' j)':d<=30?'Proche ('+d+' j)':'OK'};

rs(){try{const s=JSON.parse($('tx').value);if(!s.t||!s.t.flotte)throw 0;db=s;if(!db.p)db.p={res:5000,life:150000};save();dlg.close();render()}catch(e){$('msg').textContent='Sauvegarde invalide : rien n’a été modifié.'}},
rz(){try{localStorage.removeItem(KEY)}catch(e){}init();dlg.close();render()},
dl(k){if(!DL)return;const T=curT(),e=v=>'"'+String(v).replace(/"/g,'""')+'"';let f,d;
if(k==='csv'){f=T.id+'.csv';d='\ufeff'+[T.c.map(c=>e(c[1])).join(';')].concat(rows(T).map(r=>T.c.map(c=>e(f0(raw(c,r),c[4]))).join(';'))).join('\r\n')}
else if(k==='json'){f='base_logistique.json';d=JSON.stringify(db)}
else{if(!window.XLSX)return;const wb=XLSX.utils.book_new();TB.filter(t=>t.c).forEach(t=>{const a=[t.c.map(c=>c[1])].concat(rows(t).map(r=>t.c.map(c=>{const v=raw(c,r);return typeof v==='number'&&!isFinite(v)?'':v})));XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(a),t.l.replace(/[\\/?*\[\]:]/g,' ').slice(0,31))});f='base_logistique.xlsx';d=XLSX.write(wb,{type:'array',bookType:'xlsx'})}
DL.save({filename:f,data:d}).catch(()=>{})}
};
window.dlg=dlg;init();render();
const shim={save:o=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([o.data]));a.download=o.filename;document.body.appendChild(a);a.click();a.remove();return Promise.resolve()}};
if(window.claude&&window.claude.use){window.claude.use('downloads').then(d=>{DL=d;if(d)render()}).catch(()=>{})}else{DL=shim;render()}
})();
</script></body></html>
