.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:10px 0 16px}

.al div{padding:6px 0;border-bottom:1px solid var(--bd)}.al div:last-child{border:0}
.note{color:var(--mu);font-size:12px;margin-top:14px}

dialog label{display:block;font-size:12px;color:var(--mu);margin-bottom:8px}dialog label input,dialog label select{display:block;width:100%;margin-top:3px;color:var(--tx)}

body{font-family:"Segoe UI",Inter,Arial,sans-serif}
nav{width:252px;background:linear-gradient(185deg,#0b1f3a,#14407a);color:#dfe8fa;border:0;padding:16px 10px}

tbody tr:nth-child(even){background:rgba(110,130,170,.07)}tbody tr:hover{background:rgba(37,99,235,.1)}
.k{border:0;border-left:4px solid var(--ac);border-radius:var(--rad);box-shadow:var(--sh);padding:12px 14px}.k:nth-child(3n+2){border-left-color:#16a34a}.k:nth-child(3n){border-left-color:#f59e0b}.k b{font-size:23px}
.btn{border-radius:8px;padding:7px 14px;box-shadow:0 1px 2px rgba(16,24,40,.08)}.btn:hover{filter:brightness(.96)}.btn.p{background:linear-gradient(135deg,#2563eb,#7c3aed);border:0}
input:focus,select:focus{outline:2px solid var(--ac);outline-offset:0}

.flow{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 14px}.flow a{cursor:pointer;background:var(--sf);border-radius:20px;padding:6px 13px;font-size:12px;box-shadow:var(--sh)}.flow a:hover{background:var(--ac);color:#fff}.flow a:not(:last-child)::after{content:" →";color:var(--mu)}
dialog{border:0;border-radius:16px;box-shadow:0 24px 70px rgba(0,0,0,.35)}
#lg{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:16px;background:linear-gradient(135deg,#0b1f3a,#2563eb 60%,#7c3aed)}#lg[hidden]{display:none}
.lc{background:var(--sf);border-radius:18px;padding:28px;width:min(390px,100%);box-shadow:0 24px 70px rgba(0,0,0,.4)}.lc h1{margin:0 0 4px;font-size:22px}.lc label{display:block;font-size:12px;color:var(--mu);margin:12px 0}.lc input{display:block;width:100%;margin-top:4px;padding:9px 10px;color:var(--tx)}

nav{width:278px;padding:18px 12px 26px}

.rs{padding:4px 8px;max-width:270px}
.lw{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(320px,400px);gap:40px;align-items:center;width:min(1100px,100%);margin:auto}
.lv h2{font-size:30px;line-height:1.2;margin:0 0 8px;color:#fff}.lv p{margin:0 0 16px;color:#b9d3fa;font-size:15px;max-width:52ch}
.lv svg{width:100%;height:auto;display:block}
.lchips{display:none;flex-wrap:wrap;gap:6px}.lchips span{background:rgba(255,255,255,.12);color:#eef4ff;border-radius:16px;padding:5px 11px;font-size:13px}

.cf{fill:none;stroke:#5aa6ee;stroke-width:3;stroke-linecap:round;stroke-dasharray:3 9;animation:fl 1.8s linear infinite}

<script>
(()=>{
const NOW=new Date(),YR=NOW.getFullYear(),KEY='logdb-v1';
const num=v=>(v===''||v==null||isNaN(+v))?0:+v;
const has=v=>v!==''&&v!=null&&!isNaN(+v);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const f0=(v,d)=>typeof v==='number'?(isFinite(v)?v.toLocaleString('fr-FR',{maximumFractionDigits:d==null?2:d}):''):(v==null?'':String(v));
const sumBy=(a,f)=>a.reduce((s,r)=>s+num(f(r)),0);
const addDays=n=>{const d=new Date(NOW);d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};
const yr=d=>+String(d).slice(0,4)||YR;
/* ---- règles de calcul (reprises des classeurs d’origine) ---- */
const mv=(D,ref,t)=>sumBy(D.mvt.filter(m=>m.ref===ref&&m.type===t),m=>m.qte);
const stk=(r,D)=>mv(D,r.ref,'Entrée')-mv(D,r.ref,'Sortie');
const mini=r=>num(r.cjm)*num(r.dl)+num(r.ss);
const m3=(D,c,t)=>sumBy(D.mv23.filter(m=>m.code===c&&m.type===t),m=>m.qte);
const fin3=(r,D)=>num(r.ini)+m3(D,r.code,'Entrée')-m3(D,r.code,'Sortie');
const pid=(n,D)=>{const w=String(n||'').split(' ');return D.pers.find(x=>x.role==='Chauffeur'&&x.nom.startsWith(w[0])&&(!w[1]||x.nom.split(' ').pop().startsWith(w[1][0])))};
const stat=(r,D)=>{const s=stk(r,D);return s<=num(r.ss)?'Critique':s<=mini(r)?'Réappro':'OK'};
const norme=z=>/asphalte/i.test(z)?12:/masisi/i.test(z)?22:/rutshuru/i.test(z)?16:15;
const cons=r=>num(r.kmd)?num(r.lit)/num(r.kmd)*100:NaN;
const eca=r=>(cons(r)-norme(r.zone))/norme(r.zone);
const calert=r=>{const e=eca(r);return !isFinite(e)?'':e>.15?'Surconsommation':e<-.15?'Sous-consommation':'Normal'};
const kmp=r=>has(r.kmd)&&has(r.kmr)?r.kmr-r.kmd:'';
const avb=r=>num(r.qte)*num(r.pu);
const ans=r=>Math.max(0,YR-yr(r.date));
const aam=r=>Math.min(avb(r),avb(r)*num(r.taux)/100*ans(r));
const reste=r=>has(r.prox)?r.prox-num(r.cpt):'';
const malert=r=>reste(r)===''?'':reste(r)<=(r.type==='Véhicule'?1000:100)?'Échéance proche':'OK';
const ech=r=>{if(!r.next)return'';const d=Math.round((new Date(r.next)-NOW)/864e5);return d<0?'Échu ('+(-d)+' j)':d<=30?'Proche ('+d+' j)':'OK'};
/* ---- schéma : [clé, libellé, type(t|n|d|s|f|c), options|fn, décimales] ---- */
const TB=[
{id:'dash',g:'Pilotage',l:'Tableau de bord'},
{id:'users',g:'Paramètres super admin',l:'Utilisateurs & rôles'},
{id:'req',g:'1. Besoin & achat',l:'Réquisitions (SR)',s:'Demande de Réquisition (SR)',c:[['sr','N° SR'],['date','Date','d'],['des','Désignation'],['code','Code actif / catégorie'],['u','Unité'],['qte','Qté','n'],['pu','P.U. estimé ($)','n'],['tot','Total ($)','c',r=>num(r.qte)*num(r.pu)],['just','Justification']],sum:['tot']},
{id:'po',g:'1. Besoin & achat',l:'Bons de commande (PO)',s:'Bon de Commande (PO)',c:[['po','N° PO'],['four','Fournisseur'],['code','Code article'],['des','Désignation'],['u','Unité'],['qte','Qté','n'],['pu','P.U. ($)','n'],['tot','Total HT ($)','c',r=>num(r.qte)*num(r.pu)],['lig','Ligne budgétaire']],sum:['tot']},
{id:'achats',g:'1. Besoin & achat',l:'Suivi des achats & budget',s:'Suivi des Achats, Tableau de Bord, Plan d’Achat',c:[['id','ID achat'],['des','Désignation'],['lieu','Lieu de livraison'],['qte','Qté','n'],['pub','P.U. budget ($)','n'],['pur','P.U. réel ($)','n'],['bud','Budget ($)','c',r=>num(r.qte)*num(r.pub)],['rel','Réel ($)','c',r=>num(r.qte)*num(r.pur)],['ec','Écart ($)','c',r=>num(r.qte)*(num(r.pur)-num(r.pub))],['statut','Statut','s',['Livré','En attente']]],sum:['bud','rel','ec']},
{id:'recep',g:'2. Réception',l:'Réceptions entrepôt',s:'Fiche de Pointage Réception',c:[['date','Date','d'],['po','N° PO'],['ref','Réf.'],['des','Désignation'],['u','Unité'],['att','Qté attendue (BL)','n'],['rec','Qté reçue','n'],['ec','Écart','c',r=>num(r.rec)-num(r.att)],['dec','Décision'],['empl','Emplacement'],['ano','Anomalie']],sum:['att','rec','ec']},
{id:'articles',g:'3. Stockage',l:'Catalogue articles',s:'Produits, Gestion des Stocks, Plan d’Appro',c:[['ref','Référence'],['des','Désignation'],['u','Unité'],['cjm','Conso. jour moy.','n'],['dl','Délai livr. (j)','n'],['ss','Stock sécurité','n'],['pu','P.U. ($)','n'],['min','Stock min. (=CJM×délai+sécu.)','c',mini]]},
{id:'mvt',g:'3. Stockage',l:'Mouvements de stock',s:'Gestion des Stocks (entrées/sorties)',c:[['date','Date','d'],['ref','Article','f','art'],['des','Désignation','c',(r,D)=>(D.articles.find(a=>a.ref===r.ref)||{}).des||''],['type','Mouvement','s',['Entrée','Sortie']],['qte','Qté','n']]},
{id:'stock',g:'3. Stockage',l:'Stock & alertes',base:'articles',ro:1,s:'Inventaire du Stock, Stocks & Planification',c:[['ref','Réf.'],['des','Désignation'],['u','Unité'],['ent','Entrées','c',(r,D)=>mv(D,r.ref,'Entrée')],['sor','Sorties','c',(r,D)=>mv(D,r.ref,'Sortie')],['stk','Stock actuel','c',stk],['min','Stock min.','c',r=>mini(r)],['st','Statut','c',stat],['val','Valeur ($)','c',(r,D)=>stk(r,D)*num(r.pu)],['rea','Réappro. estimé','c',(r,D)=>stat(r,D)==='OK'?'':addDays(num(r.dl))]],sum:['val']},
{id:'prod23',g:'3. Stockage',l:'Inventaire 2023',s:'Inventaire du Stock (données 2023)',c:[['code','Code article'],['des','Désignation'],['min','Stock min','n'],['ini','Stock initial','n'],['pu','P.U. ($)','n'],['ent','Entrées','c',(r,D)=>m3(D,r.code,'Entrée')],['sor','Sorties','c',(r,D)=>m3(D,r.code,'Sortie')],['fin','Stock final','c',fin3],['val','Valeur ($)','c',(r,D)=>fin3(r,D)*num(r.pu)],['al','Alerte','c',(r,D)=>fin3(r,D)<=num(r.min)?'ALERTE':'Correct']],sum:['val']},
{id:'mv23',g:'3. Stockage',l:'Mouvements 2023',s:'Entrées et Sorties (données 2023)',c:[['date','Date','d'],['code','Code article','f','p23'],['des','Désignation','c',(r,D)=>(D.prod23.find(a=>a.code===r.code)||{}).des||''],['type','Mouvement','s',['Entrée','Sortie']],['qte','Qté','n']]},
{id:'seuils',g:'3. Stockage',l:'Seuils de stock',s:'Gestion des Seuils de Stock',c:[['code','Code article'],['des','Désignation'],['u','Unité'],['min','Stock min. (alerte)','n'],['max','Stock max. (plafond)','n'],['qec','Écart (QEC)','c',r=>num(r.max)-num(r.min)]]},
{id:'sorties',g:'4. Sortie des biens',l:'Sorties & expéditions',s:'Sortie Interne Base, Bordereau d’Expédition',c:[['type','Type','s',['Usage interne','Expédition']],['doc','N° document'],['date','Date','d'],['dest','Bénéficiaire / destination'],['ref','Réf. / ID actif'],['des','Désignation'],['qte','Qté sortie','n'],['recu','Qté reçue terrain','n'],['veh','Véhicule','f','veh'],['ec','Écart','c',r=>has(r.recu)?r.recu-num(r.qte):'']]},
{id:'flotte',g:'5. Flotte, km & carburant',l:'État de la flotte',s:'1. État de la Flotte',c:[['code','Code'],['imm','Immatriculation'],['mod','Marque / modèle'],['typ','Type'],['an','Année','n'],['chs','N° châssis'],['acq','Acquisition','d'],['cout','Coût initial ($)','n'],['statut','Statut','s',['Disponible','En Mission','En Maintenance']],['next','Prochain entretien','d'],['chf','Chauffeur attitré','f','chf'],['ech','Échéance','c',ech]],sum:['cout']},
{id:'trajets',g:'5. Flotte, km & carburant',l:'Trajets & kilométrage',s:'2. Suivi des Mouvements, Suivi Consommation, Registre Missions',c:[['date','Date','d'],['veh','Véhicule','f','veh'],['chf','Chauffeur','f','chf'],['trj','Trajet / destination'],['mot','Motif'],['eq','Équipage / passagers'],['hd','Départ'],['hr','Retour'],['kmd','Km départ','n'],['kmr','Km retour','n'],['km','Km parcourus','c',kmp],['pid','ID chauffeur (personnel)','c',(r,D)=>(pid(r.chf,D)||{}).id||''],['statut','Statut','s',['En cours','Terminé']]],sum:['km']},
{id:'carb',g:'5. Flotte, km & carburant',l:'Carburant & consommation',s:'3. Carburant & Consommation, Suivi Flotte & Consommation',c:[['date','Date','d'],['veh','Véhicule','f','veh'],['chf','Chauffeur','f','chf'],['zone','Axe / zone'],['kmc','Km compteur','n'],['lit','Litres','n'],['cout','Coût ($)','n'],['sta','Station / source'],['kmd','Km depuis dernier plein','n'],['cons','Conso (L/100 km)','c',cons,1],['nor','Norme zone','c',r=>norme(r.zone)],['ec','Écart (%)','c',r=>eca(r)*100,1],['al','Alerte','c',calert]],sum:['lit','cout']},

function usersView(){return '<h2>Utilisateurs & rôles</h2><div class="src">Accès réservé au super admin · en cas de changement de poste, modifiez le rôle directement dans la colonne Rôle</div><div class="bar"><button class="btn p" onclick="A.nu()">+ Nouvel utilisateur</button></div><div class="tw"><table><thead><tr><th>Nom</th><th>E-mail</th><th>Rôle</th><th></th></tr></thead><tbody>'+db.users.map((u,i)=>'<tr><td>'+esc(u.nom)+'</td><td>'+esc(u.email)+'</td><td>'+(u.email===SU?'<span class="b o">'+ROLES[u.role].l+'</span>':'<select class="rs" title="Changer le rôle" onchange="A.rl('+i+',this.value)">'+Object.keys(ROLES).filter(k=>k!=='super_admin').map(k=>'<option value="'+k+'"'+(k===u.role?' selected':'')+'>'+ROLES[k].l+'</option>').join('')+'</select>')+'</td><td class="act"><button title="Modifier (rôle, mot de passe)" onclick="A.eu('+i+')">✎</button>'+(u.email===SU?'':'<button title="Supprimer" onclick="A.du('+i+')">✕</button>')+'</td></tr>').join('')+'</tbody></table></div><h3>Droits par rôle</h3><div class="al">'+Object.keys(ROLES).filter(k=>k!=='super_admin').map(k=>'<div><b>'+ROLES[k].l+'</b><br>'+TB.filter(t=>ROLES[k].p[t.id]).map(t=>esc(t.l)+' <small>('+LV[ROLES[k].p[t.id]]+')</small>').join(' · ')+'</div>').join('')+'<div><b>Super admin</b><br>Accès total, gestion des utilisateurs, sauvegarde et restauration</div></div>'}
const raw=(c,r)=>c[2]==='c'?c[3](r,db.t):r[c[0]];
const badge=s=>/Échu|Critique|ALERTE|Surconso|Refus|Échéance/.test(s)?'e':/Proche|Réappro|attente|En cours|Sous-|Maintenance|Mission/i.test(s)?'w':/^(OK|Correct|Normal|Terminé|Livré|Disponible|Clôturé|Accepté|Excellent)/.test(s)?'o':'';
const cell=(c,r)=>{const v=raw(c,r),s=f0(v,c[4]),t=c[2]||'t',b=(t==='s'||t==='c')&&typeof v==='string'&&s?badge(s):'';
return{t:s,h:b?'<span class="b '+b+'">'+esc(s)+'</span>':esc(s),n:typeof v==='number'||t==='n'}};

function render(){if(!me)return;let g='';$('nav').innerHTML='<h1>ERP/SUPPLY LOG</h1><span class="sb">Base de données logistique</span><div class="me"><b>'+esc(me.nom)+'</b><small>'+ROLES[me.role].l+'</small><div><button onclick="A.pw()">Mot de passe</button><button onclick="A.out()">Déconnexion</button></div></div>'+TB.filter(T=>vis(T.id)).map(T=>{const h=T.g!==g?'<h4>'+(IC[T.g]||'')+' '+T.g+'</h4>':'';g=T.g;return h+'<button class="'+(T.id===cur?'on':'')+'" onclick="A.go(\''+T.id+'\')">'+T.l+'</button>'}).join('')+(me.role==='super_admin'?(DL?'<button class="adm" onclick="A.dl(\'xlsx\')">⬇ Tout en Excel (.xlsx)</button><button class="adm" onclick="A.dl(\'json\')">⬇ Sauvegarde (.json)</button>':'')+'<button class="adm" onclick="A.bk()">Sauvegarde / restauration</button>':'');
$('dls').innerHTML=[['veh',db.t.flotte.map(v=>v.code)],['art',db.t.articles.map(a=>a.ref)],['p23',db.t.prod23.map(a=>a.code)],['chf',[...new Set([...db.t.flotte.map(v=>v.chf),...db.t.trajets.map(t=>t.chf)])].filter(Boolean)]].map(([k,l])=>'<datalist id="dl-'+k+'">'+l.map(x=>'<option value="'+esc(x)+'">').join('')+'</datalist>').join('');
$('main').innerHTML=cur==='dash'?dash():cur==='users'?usersView():tbl(TB.find(t=>t.id===cur));
const s=document.querySelector('input[type=search]');if(s&&q){s.focus();s.setSelectionRange(q.length,q.length)}}
function tbl(T0){const T=Object.assign({},T0,{ro:T0.ro||!can(T0.id,'w'),del:can(T0.id,'d')});const R=rows(T),ql=q.toLowerCase();
const L=R.map((r,i)=>({r,i,cs:T.c.map(c=>cell(c,r))})).filter(x=>!ql||x.cs.some(c=>c.t.toLowerCase().includes(ql)));
const sm=T.sum||[];
return '<h2>'+T.l+'</h2><div class="src">Source : '+T.s+' · '+L.length+' ligne(s)</div><div class="bar"><input type="search" placeholder="Rechercher…" value="'+esc(q)+'" oninput="A.q(this.value)">'+(T.ro?'':'<button class="btn p" onclick="A.add()">+ Ajouter</button>')+'<button class="btn" onclick="A.csv()">Exporter CSV</button>'+(DL?'<button class="btn p" onclick="A.dl(\'csv\')">⬇ Télécharger .csv</button>':'')+''+(me.role==='super_admin'?'<button class="btn" onclick="A.bk()">Sauvegarde</button>':'')+'</div>'
+'<div class="tw"><table><thead><tr>'+T.c.map(c=>'<th>'+esc(c[1])+'</th>').join('')+(T.ro?'':'<th></th>')+'</tr></thead><tbody>'
+L.map(x=>'<tr>'+x.cs.map(c=>'<td'+(c.n?' class="r"':'')+'>'+c.h+'</td>').join('')+(T.ro?'':'<td class="act"><button title="Modifier" onclick="A.ed('+x.i+')">✎</button>'+(T.del?'<button title="Supprimer" onclick="A.rm('+x.i+')">✕</button>':'')+'</td>')+'</tr>').join('')
+(sm.length?'<tr class="t">'+T.c.map((c,j)=>j===0?'<td>Total</td>':sm.includes(c[0])?'<td class="r">'+f0(sumBy(L,x=>raw(c,x.r)),c[4])+'</td>':'<td></td>').join('')+(T.ro?'':'<td></td>')+'</tr>':'')
+'</tbody></table></div>'}
const kp=(l,v,s)=>'<div class="k"><span>'+l+'</span><b>'+v+'</b>'+(s?'<small>'+s+'</small>':'')+'</div>';
function dash(){const D=db.t,p=db.p;
const sv=sumBy(D.articles,r=>stk(r,D)*num(r.pu)),sa=D.articles.filter(r=>stat(r,D)!=='OK');
const bud=sumBy(D.achats,r=>num(r.qte)*num(r.pub)),rel=sumBy(D.achats,r=>num(r.qte)*num(r.pur));
const liv=D.achats.filter(r=>r.statut==='Livré').length/(D.achats.length||1);
const km=sumBy(D.trajets,kmp),lit=sumBy(D.carb,r=>r.lit),cc=sumBy(D.carb,r=>r.cout),kc=sumBy(D.carb,r=>r.kmd);
const rep=sumBy(D.pannes,r=>r.cout)+sumBy(D.maint,r=>r.cout);
const vb=sumBy(D.actifs,avb),van=vb-sumBy(D.actifs,aam);
const al=[];
sa.forEach(r=>al.push(['Stock',r.ref+' – '+r.des+' : stock '+f0(stk(r,D))+' (min '+f0(mini(r))+') → '+stat(r,D)]));
D.carb.filter(r=>/Surconso|Sous-/.test(calert(r))).forEach(r=>al.push(['Carburant',r.date+' '+r.veh+' : '+f0(cons(r),1)+' L/100 km pour une norme de '+norme(r.zone)+' → '+calert(r)]));
const last={};D.maint.forEach(m=>{if(!last[m.code]||m.date>last[m.code].date)last[m.code]=m});
Object.values(last).filter(m=>malert(m)==='Échéance proche').forEach(m=>al.push(['Maintenance',m.code+' : prochain service à '+f0(m.prox)+', compteur à '+f0(m.cpt)]));
D.pannes.filter(r=>r.statut!=='Clôturé').forEach(r=>al.push(['Panne',r.id+' '+r.veh+' : '+r.des+' ('+r.statut+')']));
D.flotte.filter(v=>/Échu/.test(ech(v))).forEach(v=>al.push(['Flotte',v.code+' : entretien prévu le '+v.next+' → '+ech(v)]));
const V=D.flotte.map(v=>{const k=sumBy(D.trajets.filter(t=>t.veh===v.code),kmp),cr=D.carb.filter(c=>c.veh===v.code),l=sumBy(cr,c=>c.lit),kk=sumBy(cr,c=>c.kmd),cf=sumBy(cr,c=>c.cout),
rp=sumBy(D.pannes.filter(x=>x.veh===v.code),x=>x.cout)+sumBy(D.maint.filter(x=>x.code===v.code),x=>x.cout),am=k*(num(v.cout)-num(p.res))/(num(p.life)||1);
return '<tr><td>'+esc(v.code)+'</td><td>'+esc(v.mod)+'</td><td class="r">'+f0(k)+'</td><td class="r">'+f0(l)+'</td><td class="r">'+f0(cf)+'</td><td class="r">'+f0(kk?l/kk*100:NaN,1)+'</td><td class="r">'+f0(rp)+'</td><td class="r">'+f0(am)+'</td><td class="r"><b>'+f0(cf+rp+am)+'</b></td></tr>'}).join('');
return '<h2>Tableau de bord</h2><div class="src">Chaîne logistique : cliquez sur une étape</div>'+flow()+'<div class="kp">'
+kp('Valeur du stock',f0(sv)+' $',D.articles.length+' articles')+kp('Articles en alerte',sa.length,'critique ou à réapprovisionner')
+kp('Budget achats',f0(bud)+' $','réel '+f0(rel)+' $ · écart '+f0(rel-bud)+' $')+kp('Taux de livraison',f0(liv*100,0)+' %',D.achats.length+' achats')
+kp('Km parcourus',f0(km),D.trajets.length+' trajets')+kp('Carburant',f0(lit)+' L',f0(cc)+' $ · '+f0(kc?lit/kc*100:NaN,1)+' L/100 km')
+kp('Pannes & maintenance',f0(rep)+' $',D.pannes.filter(r=>r.statut!=='Clôturé').length+' panne(s) ouverte(s)')+kp('Actifs (VAN)',f0(van)+' $','achat '+f0(vb)+' $')+'</div>'
+'<h3>Coût d’exploitation par véhicule</h3><div class="tw"><table><thead><tr><th>Véhicule</th><th>Modèle</th><th>Km</th><th>Litres</th><th>Carburant ($)</th><th>L/100 km</th><th>Réparations ($)</th><th>Amort. km ($)</th><th>Total ($)</th></tr></thead><tbody>'+V+'</tbody></table></div>'
+'<div class="bar">Valeur résiduelle ($) <input type="number" style="width:100px" value="'+num(p.res)+'" onchange="A.p(\'res\',this.value)"> Durée de vie (km) <input type="number" style="width:110px" value="'+num(p.life)+'" onchange="A.p(\'life\',this.value)"></div>'
+'<h3>Alertes ('+al.length+')</h3><div class="al">'+(al.map(a=>'<div><span class="b '+(a[0]==='Panne'||a[0]==='Flotte'?'e':'w')+'">'+a[0]+'</span> '+esc(a[1])+'</div>').join('')||'<div>Aucune alerte.</div>')+'</div>'
+'<p class="note">Hypothèses : amortissement kilométrique = km × (coût initial − valeur résiduelle) ÷ durée de vie, paramètres repris de la feuille « Amortissement & Réparations » (VEH-001) et appliqués à tous les véhicules. Seuil d’alerte maintenance : 1 000 km (véhicules) ou 100 h (groupes). Dates relatives à aujourd’hui.</p>'}
/* ---- actions ---- */
const dlg=$('dlg');
const dlgOpen=h=>{dlg.innerHTML=h;if(!dlg.open)dlg.showModal()};
const curT=()=>TB.find(t=>t.id===cur);
const A=window.A={
go(id){if(!vis(id))return;cur=id;q='';render();$('main').scrollTop=0},
q(v){q=v;render()},
p(k,v){db.p[k]=num(v);save();render()},
add(){A.form(null)},ed(i){A.form(i)},
form(i){const T=curT(),r=i==null?{}:rows(T)[i];
dlgOpen('<h3 style="margin-top:0">'+(i==null?'Ajouter':'Modifier')+' – '+T.l+'</h3><div class="g2">'+T.c.filter(c=>c[2]!=='c').map(c=>{const t=c[2]||'t',v=r[c[0]]==null?'':r[c[0]];
const inp=t==='s'?'<select name="'+c[0]+'">'+['',...c[3]].map(o=>'<option'+(o===v?' selected':'')+'>'+esc(o)+'</option>').join('')+'</select>':'<input name="'+c[0]+'" type="'+(t==='n'?'number':t==='d'?'date':'text')+'"'+(t==='n'?' step="any"':'')+(t==='f'?' list="dl-'+c[3]+'"':'')+' value="'+esc(v)+'">';
return '<label>'+esc(c[1])+inp+'</label>'}).join('')+'</div><div class="bar"><button class="btn p" onclick="A.ok('+(i==null?'null':i)+')">Enregistrer</button><button class="btn" onclick="dlg.close()">Annuler</button></div>')},
ok(i){if(!can(cur,'w'))return;const T=curT(),o={};dlg.querySelectorAll('[name]').forEach(e=>{const c=T.c.find(c=>c[0]===e.name);o[e.name]=c[2]==='n'?(e.value===''?'':+e.value):e.value});
if(i==null)rows(T).push(o);else rows(T)[i]=o;save();dlg.close();render()},
rm(i){dlgOpen('<h3 style="margin-top:0">Supprimer cette ligne ?</h3><p>Cette action est définitive.</p><div class="bar"><button class="btn d" onclick="A.del('+i+')">Supprimer</button><button class="btn" onclick="dlg.close()">Annuler</button></div>')},
del(i){if(!can(cur,'d'))return;rows(curT()).splice(i,1);save();dlg.close();render()},
csv(){const T=curT(),R=rows(T),e=v=>'"'+String(v).replace(/"/g,'""')+'"';
const t=[T.c.map(c=>e(c[1])).join(';')].concat(R.map(r=>T.c.map(c=>e(f0(raw(c,r),c[4]))).join(';'))).join('\n');
dlgOpen('<h3 style="margin-top:0">CSV – '+T.l+'</h3><p class="note">Copiez ce texte, puis collez-le dans Excel ou un fichier .csv.</p><textarea id="tx" readonly>'+esc(t)+'</textarea><div class="bar"><button class="btn p" onclick="A.cp()">Copier</button><button class="btn" onclick="dlg.close()">Fermer</button></div>')},
bk(){dlgOpen('<h3 style="margin-top:0">Sauvegarde de toute la base</h3><p class="note">Copiez ce JSON pour sauvegarder. Pour restaurer, collez une sauvegarde ci-dessous puis cliquez sur Restaurer.</p><textarea id="tx">'+esc(JSON.stringify(db))+'</textarea><div id="msg" class="note"></div><div class="bar"><button class="btn p" onclick="A.cp()">Copier</button><button class="btn" onclick="A.rs()">Restaurer</button><button class="btn d" onclick="A.rz()">Réinitialiser (données d’origine)</button><button class="btn" onclick="dlg.close()">Fermer</button></div>')},
cp(){const t=$('tx');t.select();try{navigator.clipboard.writeText(t.value).catch(()=>document.execCommand('copy'))}catch(e){try{document.execCommand('copy')}catch(x){}}},
rs(){try{const s=JSON.parse($('tx').value);if(!s.t||!s.t.flotte)throw 0;const u0=db.users;db=s;db.users=u0;if(!db.p)db.p={res:5000,life:150000};save();dlg.close();render()}catch(e){$('msg').textContent='Sauvegarde invalide : rien n’a été modifié.'}},
rz(){try{localStorage.removeItem(KEY)}catch(e){}const u0=db.users;init();db.users=u0;save();dlg.close();render()},
async login(){const e=$('le').value.trim().toLowerCase(),u=db.users.find(x=>x.email===e),m=$('lm');if(!window.crypto||!crypto.subtle){m.textContent='Connexion indisponible : ouvrez la page en HTTPS.';return}
const ok=u&&await hsh($('lp').value,u.salt)===u.hash;if(!ok){await new Promise(r=>setTimeout(r,700));m.textContent='E-mail ou mot de passe incorrect.';return}
me=u;try{sessionStorage.setItem('logdb-sess',u.email)}catch(x){}$('lg').hidden=true;cur='dash';render()},
out(){try{sessionStorage.removeItem('logdb-sess')}catch(e){}me=null;$('nav').innerHTML='';$('main').innerHTML='';showLogin()},
nu(){dlgOpen('<h3 style="margin-top:0">Nouvel utilisateur</h3>'+fld('un','Nom complet')+fld('ue','E-mail','email')+rsel('magasinier')+fld('up','Mot de passe initial (8 caractères min.)','password')+'<div id="msg" class="note"></div><div class="bar"><button class="btn p" onclick="A.su()">Créer</button><button class="btn" onclick="dlg.close()">Annuler</button></div>')},
async su(){if(me.role!=='super_admin')return;const n=$('un').value.trim(),e=$('ue').value.trim().toLowerCase(),p=$('up').value,m=$('msg');if(!n||!/^\S+@\S+\.\S+$/.test(e)||p.length<8){m.textContent='Nom, e-mail valide et mot de passe de 8 caractères minimum requis.';return}if(db.users.some(u=>u.email===e)){m.textContent='Cet e-mail existe déjà.';return}
const s=rnd();db.users.push({email:e,nom:n,role:$('ur').value,salt:s,hash:await hsh(p,s)});save();dlg.close();render()},
eu(i){const u=db.users[i];dlgOpen('<h3 style="margin-top:0">Modifier – '+esc(u.nom)+'</h3>'+(u.email===SU?'<p class="note">Le rôle du super admin est fixe.</p>':rsel(u.role))+fld('up','Nouveau mot de passe (vide = inchangé)','password')+'<div id="msg" class="note"></div><div class="bar"><button class="btn p" onclick="A.se('+i+')">Enregistrer</button><button class="btn" onclick="dlg.close()">Annuler</button></div>')},
async se(i){if(me.role!=='super_admin')return;const u=db.users[i],p=$('up').value;if(p&&p.length<8){$('msg').textContent='8 caractères minimum.';return}if(u.email!==SU)u.role=$('ur').value;if(p){u.salt=rnd();u.hash=await hsh(p,u.salt)}save();dlg.close();render()},
rl(i,v){if(me.role!=='super_admin')return;const u=db.users[i];if(!u||u.email===SU||!ROLES[v]||v==='super_admin')return;u.role=v;save();render()},
du(i){dlgOpen('<h3 style="margin-top:0">Supprimer cet utilisateur ?</h3><div class="bar"><button class="btn d" onclick="A.dx('+i+')">Supprimer</button><button class="btn" onclick="dlg.close()">Annuler</button></div>')},
dx(i){const u=db.users[i];if(me.role==='super_admin'&&u&&u.email!==SU&&u!==me){db.users.splice(i,1);save()}dlg.close();render()},
pw(){dlgOpen('<h3 style="margin-top:0">Changer mon mot de passe</h3>'+fld('po','Mot de passe actuel','password')+fld('up','Nouveau mot de passe (8 caractères min.)','password')+'<div id="msg" class="note"></div><div class="bar"><button class="btn p" onclick="A.sp()">Enregistrer</button><button class="btn" onclick="dlg.close()">Annuler</button></div>')},
async sp(){const m=$('msg');if(await hsh($('po').value,me.salt)!==me.hash){m.textContent='Mot de passe actuel incorrect.';return}if($('up').value.length<8){m.textContent='8 caractères minimum.';return}me.salt=rnd();me.hash=await hsh($('up').value,me.salt);save();dlg.close()},
dl(k){if(!DL)return;if(k!=='csv'&&me.role!=='super_admin')return;const T=curT(),e=v=>'"'+String(v).replace(/"/g,'""')+'"';let f,d;
if(k==='csv'){f=T.id+'.csv';d='\ufeff'+[T.c.map(c=>e(c[1])).join(';')].concat(rows(T).map(r=>T.c.map(c=>e(f0(raw(c,r),c[4]))).join(';'))).join('\r\n')}
else if(k==='json'){f='base_logistique.json';d=JSON.stringify(db)}
else{if(!window.XLSX)return;const wb=XLSX.utils.book_new();TB.filter(t=>t.c&&lv(t.id)).forEach(t=>{const a=[t.c.map(c=>c[1])].concat(rows(t).map(r=>t.c.map(c=>{const v=raw(c,r);return typeof v==='number'&&!isFinite(v)?'':v})));XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(a),t.l.replace(/[\\/?*\[\]:]/g,' ').slice(0,31))});f='base_logistique.xlsx';d=XLSX.write(wb,{type:'array',bookType:'xlsx'})}
DL.save({filename:f,data:d}).catch(()=>{})}
};
window.dlg=dlg;init();TB.sort((a,b)=>ORD.indexOf(a.id)-ORD.indexOf(b.id));boot();
const shim={save:o=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([o.data]));a.download=o.filename;document.body.appendChild(a);a.click();a.remove();return Promise.resolve()}};
if(window.claude&&window.claude.use){window.claude.use('downloads').then(d=>{DL=d;if(d)render()}).catch(()=>{})}else{DL=shim;render()}
})();
