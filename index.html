/* ---- moteur de calcul : classes typées (structure Java/C++), règles reprises des classeurs d’origine ---- */
class Stock{
static mouv(D,ref,t){return sumBy(D.mvt.filter(m=>m.ref===ref&&m.type===t),m=>m.qte)+(t==='Entrée'?sumBy(D.recep.filter(x=>x.ref===ref),x=>x.rec):sumBy(D.sorties.filter(x=>x.ref===ref),x=>x.qte))}
static niveau(r,D){return Stock.mouv(D,r.ref,'Entrée')-Stock.mouv(D,r.ref,'Sortie')}
static minimum(r){return num(r.cjm)*num(r.dl)+num(r.ss)}
static statut(r,D){const s=Stock.niveau(r,D);return s<=num(r.ss)?'Critique':s<=Stock.minimum(r)?'Réappro':'OK'}
static mouv23(D,c,t){return sumBy(D.mv23.filter(m=>m.code===c&&m.type===t),m=>m.qte)}
static final23(r,D){return num(r.ini)+Stock.mouv23(D,r.code,'Entrée')-Stock.mouv23(D,r.code,'Sortie')}}
class Flotte{
static chauffeur(n,D){const w=String(n||'').split(' ');return D.pers.find(x=>x.role==='Chauffeur'&&x.nom.startsWith(w[0])&&(!w[1]||x.nom.split(' ').pop().startsWith(w[1][0])))}
static norme(z){return /asphalte/i.test(z)?12:/masisi/i.test(z)?22:/rutshuru/i.test(z)?16:15}
static conso(r){return num(r.kmd)?num(r.lit)/num(r.kmd)*100:NaN}
static ecart(r){return (Flotte.conso(r)-Flotte.norme(r.zone))/Flotte.norme(r.zone)}
static alerte(r){const e=Flotte.ecart(r);return !isFinite(e)?'':e>.15?'Surconsommation':e<-.15?'Sous-consommation':'Normal'}
static km(r){return has(r.kmd)&&has(r.kmr)?r.kmr-r.kmd:''}
static echeance(r){if(!r.next)return'';const d=Math.round((new Date(r.next)-NOW)/864e5);return d<0?'Échu ('+(-d)+' j)':d<=30?'Proche ('+d+' j)':'OK'}}
class Actifs{
static achat(r){return num(r.qte)*num(r.pu)}
static annees(r){return Math.max(0,YR-yr(r.date))}
static amort(r){return Math.min(Actifs.achat(r),Actifs.achat(r)*num(r.taux)/100*Actifs.annees(r))}}
class Maintenance{
static reste(r){return has(r.prox)?r.prox-num(r.cpt):''}
static alerte(r){const x=Maintenance.reste(r);return x===''?'':x<=(r.type==='Véhicule'?1000:100)?'Échéance proche':'OK'}}

const sendMail=async(u,l)=>{if(!(MAIL.service&&MAIL.template&&MAIL.key))return{ok:false,off:true};const m=mkMsg(u,l),H=m.body.replace(/&/g,'&amp;').replace(/\n/g,'<br>').replace(l,'<a href="'+l+'">Créer mon mot de passe</a>');try{const r=await fetch('https://api.emailjs.com/api/v1.0/email/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({service_id:MAIL.service,template_id:MAIL.template,user_id:MAIL.key,template_params:{to_email:u.email,email:u.email,to_name:u.nom,name:u.nom,from_name:'ERP/SUPPLY LOG',subject:m.sub,title:m.sub,message:m.body,message_html:H,link:l,lien:l,url:l,invite_link:l}})});if(r.ok)return{ok:true};return{ok:false,err:(await r.text()).slice(0,200)}}catch(e){return{ok:false,err:'connexion impossible ('+e.message+')'}}};
