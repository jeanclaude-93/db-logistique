<script>
(()=>{
const NOW=new Date(),YR=NOW.getFullYear(),KEY='logdb-v1';
const num=v=>(v===''||v==null||isNaN(+v))?0:+v;
const has=v=>v!==''&&v!=null&&!isNaN(+v);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const f0=(v,d)=>typeof v==='number'?(isFinite(v)?v.toLocaleString('fr-FR',{maximumFractionDigits:d==null?2:d}):''):(v==null?'':String(v));
const sumBy=(a,f)=>a.reduce((s,r)=>s+num(f(r)),0);
const addDays=n=>{const d=new Date(NOW);d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};
const yr=d=>+String(d).slice(0,4)||YR;
/* ---- règles de calcul (reprises des classeurs d’origine) ---- */
const mv=(D,ref,t)=>sumBy(D.mvt.filter(m=>m.ref===ref&&m.type===t),m=>m.qte);
const stk=(r,D)=>mv(D,r.ref,'Entrée')-mv(D,r.ref,'Sortie');
const mini=r=>num(r.cjm)*num(r.dl)+num(r.ss);
const m3=(D,c,t)=>sumBy(D.mv23.filter(m=>m.code===c&&m.type===t),m=>m.qte);
const fin3=(r,D)=>num(r.ini)+m3(D,r.code,'Entrée')-m3(D,r.code,'Sortie');
const pid=(n,D)=>{const w=String(n||'').split(' ');return D.pers.find(x=>x.role==='Chauffeur'&&x.nom.startsWith(w[0])&&(!w[1]||x.nom.split(' ').pop().startsWith(w[1][0])))};
const stat=(r,D)=>{const s=stk(r,D);return s<=num(r.ss)?'Critique':s<=mini(r)?'Réappro':'OK'};
const norme=z=>/asphalte/i.test(z)?12:/masisi/i.test(z)?22:/rutshuru/i.test(z)?16:15;
const cons=r=>num(r.kmd)?num(r.lit)/num(r.kmd)*100:NaN;
const eca=r=>(cons(r)-norme(r.zone))/norme(r.zone);
const calert=r=>{const e=eca(r);return !isFinite(e)?'':e>.15?'Surconsommation':e<-.15?'Sous-consommation':'Normal'};
const kmp=r=>has(r.kmd)&&has(r.kmr)?r.kmr-r.kmd:'';
const avb=r=>num(r.qte)*num(r.pu);
const ans=r=>Math.max(0,YR-yr(r.date));
const aam=r=>Math.min(avb(r),avb(r)*num(r.taux)/100*ans(r));
const reste=r=>has(r.prox)?r.prox-num(r.cpt):'';
const malert=r=>reste(r)===''?'':reste(r)<=(r.type==='Véhicule'?1000:100)?'Échéance proche':'OK';
const ech=r=>{if(!r.next)return'';const d=Math.round((new Date(r.next)-NOW)/864e5);return d<0?'Échu ('+(-d)+' j)':d<=30?'Proche ('+d+' j)':'OK'};
/* ---- schéma : [clé, libellé, type(t|n|d|s|f|c), options|fn, décimales] ---- */
const TB=[
{id:'dash',g:'Pilotage',l:'Tableau de bord'},
{id:'users',g:'Paramètres super admin',l:'Utilisateurs & rôles'},
{id:'req',g:'1. Besoin & achat',l:'Réquisitions (SR)',s:'Demande de Réquisition (SR)',c:[['sr','N° SR'],['date','Date','d'],['des','Désignation'],['code','Code actif / catégorie'],['u','Unité'],['qte','Qté','n'],['pu','P.U. estimé ($)','n'],['tot','Total ($)','c',r=>num(r.qte)*num(r.pu)],['just','Justification']],sum:['tot']},
{id:'po',g:'1. Besoin & achat',l:'Bons de commande (PO)',s:'Bon de Commande (PO)',c:[['po','N° PO'],['four','Fournisseur'],['code','Code article'],['des','Désignation'],['u','Unité'],['qte','Qté','n'],['pu','P.U. ($)','n'],['tot','Total HT ($)','c',r=>num(r.qte)*num(r.pu)],['lig','Ligne budgétaire']],sum:['tot']},
{id:'achats',g:'1. Besoin & achat',l:'Suivi des achats & budget',s:'Suivi des Achats, Tableau de Bord, Plan d’Achat',c:[['id','ID achat'],['des','Désignation'],['lieu','Lieu de livraison'],['qte','Qté','n'],['pub','P.U. budget ($)','n'],['pur','P.U. réel ($)','n'],['bud','Budget ($)','c',r=>num(r.qte)*num(r.pub)],['rel','Réel ($)','c',r=>num(r.qte)*num(r.pur)],['ec','Écart ($)','c',r=>num(r.qte)*(num(r.pur)-num(r.pub))],['statut','Statut','s',['Livré','En attente']]],sum:['bud','rel','ec']},
{id:'recep',g:'2. Réception',l:'Réceptions entrepôt',s:'Fiche de Pointage Réception',c:[['date','Date','d'],['po','N° PO'],['ref','Réf.'],['des','Désignation'],['u','Unité'],['att','Qté attendue (BL)','n'],['rec','Qté reçue','n'],['ec','Écart','c',r=>num(r.rec)-num(r.att)],['dec','Décision'],['empl','Emplacement'],['ano','Anomalie']],sum:['att','rec','ec']},
{id:'articles',g:'3. Stockage',l:'Catalogue articles',s:'Produits, Gestion des Stocks, Plan d’Appro',c:[['ref','Référence'],['des','Désignation'],['u','Unité'],['cjm','Conso. jour moy.','n'],['dl','Délai livr. (j)','n'],['ss','Stock sécurité','n'],['pu','P.U. ($)','n'],['min','Stock min. (=CJM×délai+sécu.)','c',mini]]},
{id:'mvt',g:'3. Stockage',l:'Mouvements de stock',s:'Gestion des Stocks (entrées/sorties)',c:[['date','Date','d'],['ref','Article','f','art'],['des','Désignation','c',(r,D)=>(D.articles.find(a=>a.ref===r.ref)||{}).des||''],['type','Mouvement','s',['Entrée','Sortie']],['qte','Qté','n']]},
{id:'stock',g:'3. Stockage',l:'Stock & alertes',base:'articles',ro:1,s:'Inventaire du Stock, Stocks & Planification',c:[['ref','Réf.'],['des','Désignation'],['u','Unité'],['ent','Entrées','c',(r,D)=>mv(D,r.ref,'Entrée')],['sor','Sorties','c',(r,D)=>mv(D,r.ref,'Sortie')],['stk','Stock actuel','c',stk],['min','Stock min.','c',r=>mini(r)],['st','Statut','c',stat],['val','Valeur ($)','c',(r,D)=>stk(r,D)*num(r.pu)],['rea','Réappro. estimé','c',(r,D)=>stat(r,D)==='OK'?'':addDays(num(r.dl))]],sum:['val']},
{id:'prod23',g:'3. Stockage',l:'Inventaire 2023',s:'Inventaire du Stock (données 2023)',c:[['code','Code article'],['des','Désignation'],['min','Stock min','n'],['ini','Stock initial','n'],['pu','P.U. ($)','n'],['ent','Entrées','c',(r,D)=>m3(D,r.code,'Entrée')],['sor','Sorties','c',(r,D)=>m3(D,r.code,'Sortie')],['fin','Stock final','c',fin3],['val','Valeur ($)','c',(r,D)=>fin3(r,D)*num(r.pu)],['al','Alerte','c',(r,D)=>fin3(r,D)<=num(r.min)?'ALERTE':'Correct']],sum:['val']},
{id:'mv23',g:'3. Stockage',l:'Mouvements 2023',s:'Entrées et Sorties (données 2023)',c:[['date','Date','d'],['code','Code article','f','p23'],['des','Désignation','c',(r,D)=>(D.prod23.find(a=>a.code===r.code)||{}).des||''],['type','Mouvement','s',['Entrée','Sortie']],['qte','Qté','n']]},
{id:'seuils',g:'3. Stockage',l:'Seuils de stock',s:'Gestion des Seuils de Stock',c:[['code','Code article'],['des','Désignation'],['u','Unité'],['min','Stock min. (alerte)','n'],['max','Stock max. (plafond)','n'],['qec','Écart (QEC)','c',r=>num(r.max)-num(r.min)]]},

const b64e=o=>btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const b64d=t=>{try{t=t.replace(/-/g,'+').replace(/_/g,'/');while(t.length%4)t+='=';return JSON.parse(decodeURIComponent(escape(atob(t))))}catch(e){return null}};

const mkMsg=(u,l)=>({sub:'Bienvenue à l’ERP/SUPPLY LOG',body:'Bonjour '+u.nom+',\n\nBienvenue à l’ERP/SUPPLY LOG de l’organisation. Veuillez cliquer sur le lien ci-dessous pour changer un mot de passe qui vous convient :\n\n'+l+'\n\nCe lien est valable '+INV_DAYS+' jours et ne peut être utilisé qu’une seule fois.'});
const sendMail=async(u,l)=>{if(!(MAIL.service&&MAIL.template&&MAIL.key))return{ok:false,off:true};const m=mkMsg(u,l);try{const r=await fetch('https://api.emailjs.com/api/v1.0/email/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({service_id:MAIL.service,template_id:MAIL.template,user_id:MAIL.key,template_params:{to_email:u.email,email:u.email,to_name:u.nom,name:u.nom,from_name:'ERP/SUPPLY LOG',subject:m.sub,title:m.sub,message:m.body,link:l}})});if(r.ok)return{ok:true};return{ok:false,err:(await r.text()).slice(0,200)}}catch(e){return{ok:false,err:'connexion impossible ('+e.message+')'}}};
const showLogin=()=>{const l=$('lg');l.hidden=false;l.innerHTML=`<div class="lw"><div class="lv"><div class="lh"><img src="${HERO}" alt="Circuit logistique : réquisition et commande, transport aérien, maritime et routier, réception et entreposage, distribution aux programmes, documentation et reporting"></div><blockquote>« ${QUOTE} »</blockquote></div><div class="lc"><h1>ERP/SUPPLY LOG</h1><p class="note" style="margin-top:0">Connectez-vous pour accéder à la base de données.</p><label>E-mail<input id="le" type="email" autocomplete="username" onkeydown="if(event.key==='Enter')A.login()"></label><label>Mot de passe<input id="lp" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')A.login()"></label><div id="lm" class="note"></div><button class="btn p" style="width:100%" onclick="A.login()">Se connecter</button></div></div>`};
const showSetup=P=>{const l=$('lg');l.hidden=false;l.innerHTML=`<div class="lw one"><div class="lc"><h1>Bienvenue à l’ERP/SUPPLY LOG</h1><p class="note" style="margin-top:0">Choisissez un mot de passe qui vous convient (8 caractères minimum).</p><label>E-mail<input value="${esc(P.e)}" readonly></label><label>Nouveau mot de passe<input id="sp1" type="password" autocomplete="new-password"></label><label>Confirmer le mot de passe<input id="sp2" type="password" autocomplete="new-password" onkeydown="if(event.key==='Enter')A.setpw()"></label><div id="lm" class="note"></div><button class="btn p" style="width:100%" onclick="A.setpw()">Créer mon mot de passe</button></div></div>`};
const boot=()=>{db.users=db.users||[];if(!db.users.some(u=>u.email===SU))db.users.unshift(Object.assign({},SEEDU));save();let s=null;try{s=sessionStorage.getItem('logdb-sess')}catch(e){}const hm=location.hash.match(/^#invite=([\w-]+)$/);if(hm){const P=b64d(hm[1]);if(P&&P.e&&P.t&&P.x>Date.now()){INV=P;showSetup(P);return}showLogin();$('lm').textContent='Lien d’invitation invalide ou expiré. Demandez une nouvelle invitation.';return}const u=db.users.find(x=>x.email===s);if(u&&u.hash){me=u;render()}else showLogin()};
function usersView(){const act=db.users.filter(u=>u.hash).length,pen=db.users.length-act;
